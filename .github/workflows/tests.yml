name: Video Downloader Pro — CI Tests, Coverage & Benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main", "master" ]

env:
  # E2: kapsam eşiği. Denetim sonrası taban %19'du; gerileme olmaması için
  # eşik güncel değerin hemen altına konur ve her iyileştirmede yükseltilir.
  COVERAGE_MIN: "30"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # D3: 3.13 eklendi — geliştirme ortamı artık 3.13+ kullanıyor.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk xvfb ffmpeg libsecret-1-0

    - name: Install Pinned Dependencies & Testing Suite
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock

    - name: Verify Runtime Imports Resolve
      # D1: requirements listesi eksik olursa bu adım anında kırılır; eskiden
      # curl_cffi / pycryptodome sessizce devre dışı kalıyordu.
      run: |
        python -c "import curl_cffi, certifi; from Crypto.Cipher import AES; print('runtime deps OK')"

    - name: Run 100% Offline Pytest Suite with Core Coverage Report
      # E2: extractor.py ve gui.py artık ölçüme dahil; eşik altına düşerse CI kırılır.
      run: |
        if [ "${{ runner.os }}" = "Linux" ]; then
          xvfb-run python -m pytest \
            --cov=engine --cov=extractor --cov=gui --cov=sniffer \
            --cov=history --cov=logger --cov=exceptions --cov=extractors \
            --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=${COVERAGE_MIN} tests/
        else
          python -m pytest \
            --cov=engine --cov=extractor --cov=gui --cov=sniffer \
            --cov=history --cov=logger --cov=exceptions --cov=extractors \
            --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=${COVERAGE_MIN} tests/
        fi
      shell: bash

    - name: Run Localhost Throughput Benchmark (informational)
      # E5: paylaşımlı runner'larda throughput ölçümü kararsızdır. Regresyon
      # kapısı olarak kullanmak, kod değişmese bile derlemeyi kırıyordu.
      continue-on-error: true
      run: |
        python benchmark.py

    - name: Build and Package Windows Executable Bundle
      if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows' && matrix.python-version == '3.12'
      run: |
        python build_exe.py --onedir
        Compress-Archive -Path dist/VideoDownloaderPro -DestinationPath dist/VideoDownloaderPro-Windows-x64.zip -Force

    - name: Upload Windows Executable Artifact
      if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows' && matrix.python-version == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: VideoDownloaderPro-Windows-x64
        path: dist/VideoDownloaderPro-Windows-x64.zip
        retention-days: 1
