[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# --capture=sys: pytest'in varsayilan fd-seviyesi capture'i Windows'ta Tcl'in
# init.tcl okumasini bozuyor ve tum GUI testleri TclError ile hata veriyordu.
addopts = -v --tb=short --capture=sys
markers =
    live17: 17-site resolver and bounded real-media download gate (opt-in)
